name: Potter Strategy Live Telegram Alert

on:
  schedule:
    # 04:00 UTC = 09:30 AM IST (Monday to Friday)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz yfinance

      - name: Run Potter Live Bot
        run: python potter_telegram_bot.py
